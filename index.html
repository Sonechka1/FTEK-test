<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FTEK</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        .status-awaiting {
            background-color: yellow;
            color: black;
        }
        .status-in-transit {
            background-color: blue;
            color: white;
        }
        .status-delivered {
            background-color: green;
            color: white;
        }
    </style>
</head>
<body>
    
    <div class="container mt-5">
        <h1 class="text-center mb-4">Список грузов</h1>
        <div class="mb-4">
            <h2>Добавить новый груз</h2>
             <!-- Форма добавления товара -->
            <form id="addCargoForm" class="row g-3">
                <div class="col-md-4">
                    <label for="cargoName" class="form-label">Название груза</label>
                    <input type="text" class="form-control" id="cargoName" required>
                </div>
                <div class="col-md-4">
                    <label for="cargoOrigin" class="form-label">Пункт отправления</label>
                    <select class="form-select" id="cargoOrigin" required>
                        <option value="Москва">Москва</option>
                        <option value="Санкт-Петербург">Санкт-Петербург</option>
                        <option value="Новосибирск">Новосибирск</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="cargoDestination" class="form-label">Пункт назначения</label>
                    <select class="form-select" id="cargoDestination" required>
                        <option value="Казань">Казань</option>
                        <option value="Екатеринбург">Екатеринбург</option>
                        <option value="Санкт-Петербург">Санкт-Петербург</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="cargoDate" class="form-label">Дата отправления</label>
                    <input type="date" class="form-control" id="cargoDate" required>
                </div>
                <div class="col-md-4">
                    <label for="cargoStatus" class="form-label">Начальный статус</label>
                    <select class="form-select" id="cargoStatus" required>
                        <option value="Ожидает отправки">Ожидает отправки</option>
                        <option value="В пути">В пути</option>
                        <option value="Доставлен">Доставлен</option>
                    </select>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary">Добавить груз</button>
                </div>
            </form>
        </div>

        <!-- Фильтрация по статусу -->
        <div class="mb-4">
            <label for="statusFilter" class="form-label">Фильтр по статусу:</label>
            <select class="form-select" id="statusFilter">
                <option value="">Все</option>
                <option value="Ожидает отправки">Ожидает отправки</option>
                <option value="В пути">В пути</option>
                <option value="Доставлен">Доставлен</option>
            </select>
        </div>

        <table class="table table-bordered table-hover">
            <thead class="table-dark">
            <tr>
                <th>#</th>
                <th>Название груза</th>
                <th>Статус груза</th>
                <th>Пункт отправления</th>
                <th>Пункт назначения</th>
                <th>Дата отправления</th>
            </tr>
            </thead>
            <tbody id="cargoTableBody">
            </tbody>
        </table>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="app.js"></script>
</body>
</html>
